name: Update Profile Cards

on:
  schedule:
    - cron: "0 */6 * * *"   # auto-refresh every 6 hours
  workflow_dispatch:          # manual run from the Actions tab
  push:
    branches: [main, master]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Activity graph + Progress card (dark & light), built from your GitHub data
      - name: Generate activity + progress cards
        env:
          GH_USER: ${{ github.repository_owner }}
          # Optional: add a PAT (read:user) as secret PROFILE_TOKEN to count private contributions
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/profile_cards.py dist

      # Contribution snake (dark & light)
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=%230969da
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%232f81f7

      # Publish everything to the "output" branch
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
