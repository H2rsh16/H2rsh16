<svg width="1200" height="340" viewBox="0 0 1200 340"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="bg"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="30%" stop-color="#071225"/>
      <stop offset="55%" stop-color="#11102b"/>
      <stop offset="80%" stop-color="#081426"/>
      <stop offset="100%" stop-color="#020617"/>

      <animate attributeName="x1"
               values="0%;100%;0%"
               dur="18s"
               repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="nameGradient"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="25%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="75%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>

      <animate attributeName="x1"
               values="0%;100%;0%"
               dur="7s"
               repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="networkGradient">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="25%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="75%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="blueGlow">
      <stop offset="0%" stop-color="#2563eb" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanGlow">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleGlow">
      <stop offset="0%" stop-color="#9333ea" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur25">
      <feGaussianBlur stdDeviation="25"/>
    </filter>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

  </defs>

  <rect width="1200"
        height="340"
        fill="url(#bg)"/>

  <ellipse cx="140"
           cy="100"
           rx="340"
           ry="190"
           fill="url(#blueGlow)"
           filter="url(#blur25)">
    <animate attributeName="cx"
             values="100;350;100"
             dur="10s"
             repeatCount="indefinite"/>
  </ellipse>

  <ellipse cx="1060"
           cy="210"
           rx="350"
           ry="190"
           fill="url(#purpleGlow)"
           filter="url(#blur25)">
    <animate attributeName="cx"
             values="1100;850;1100"
             dur="12s"
             repeatCount="indefinite"/>
  </ellipse>

  <ellipse cx="600"
           cy="70"
           rx="300"
           ry="150"
           fill="url(#cyanGlow)"
           filter="url(#blur25)">
    <animate attributeName="cy"
             values="40;110;40"
             dur="9s"
             repeatCount="indefinite"/>
