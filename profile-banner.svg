<svg width="1200" height="340" viewBox="0 0 1200 340"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="bg"
                    x1="0%" y1="0%"
                    x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="30%" stop-color="#071225"/>
      <stop offset="55%" stop-color="#11102b"/>
      <stop offset="80%" stop-color="#081426"/>
      <stop offset="100%" stop-color="#020617"/>

      <animate attributeName="x1"
               values="0%;100%;0%"
               dur="18s"
               repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="nameGradient"
                    x1="0%" y1="0%"
                    x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="25%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="75%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>

      <animate attributeName="x1"
               values="0%;100%;0%"
               dur="7s"
               repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="networkGradient">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="25%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="75%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="blueGlow">
      <stop offset="0%" stop-color="#2563eb" stop-opacity=".5"/>
      <stop offset="100%" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="cyanGlow">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="purpleGlow">
      <stop offset="0%" stop-color="#9333ea" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur25">
      <feGaussianBlur stdDeviation="25"/>
    </filter>

    <filter id="glow">
      <feGaussianBlur stdDeviation="4"/>
    </filter>

  </defs>

  <rect width="1200"
        height="340"
        fill="url(#bg)"/>

  <ellipse cx="140"
           cy="100"
           rx="340"
           ry="190"
           fill="url(#blueGlow)"
           filter="url(#blur25)">
    <animate attributeName="cx"
             values="100;350;100"
             dur="10s"
             repeatCount="indefinite"/>
  </ellipse>

  <ellipse cx="1060"
           cy="210"
           rx="350"
           ry="190"
           fill="url(#purpleGlow)"
           filter="url(#blur25)">
    <animate attributeName="cx"
             values="1100;850;1100"
             dur="12s"
             repeatCount="indefinite"/>
  </ellipse>

  <ellipse cx="600"
           cy="70"
           rx="300"
           ry="150"
           fill="url(#cyanGlow)"
           filter="url(#blur25)">
    <animate attributeName="cy"
             values="40;110;40"
             dur="9s"
             repeatCount="indefinite"/>
  </ellipse>

  <g stroke="#60a5fa"
     stroke-opacity=".045"
     stroke-width="1">

    <path d="M0 40 H1200"/>
    <path d="M0 80 H1200"/>
    <path d="M0 120 H1200"/>
    <path d="M0 160 H1200"/>
    <path d="M0 200 H1200"/>
    <path d="M0 240 H1200"/>
    <path d="M0 280 H1200"/>
    <path d="M0 320 H1200"/>

    <path d="M100 0 V340"/>
    <path d="M200 0 V340"/>
    <path d="M300 0 V340"/>
    <path d="M400 0 V340"/>
    <path d="M500 0 V340"/>
    <path d="M600 0 V340"/>
    <path d="M700 0 V340"/>
    <path d="M800 0 V340"/>
    <path d="M900 0 V340"/>
    <path d="M1000 0 V340"/>
    <path d="M1100 0 V340"/>

  </g>

  <g fill="none"
     stroke="url(#networkGradient)"
     stroke-width="1.2">

    <path d="
      M30 245
      L170 110
      L320 185
      L450 65
      L600 145
      L760 60
      L900 165
      L1040 75
      L1180 220">

      <animate attributeName="stroke-opacity"
               values=".1;.65;.1"
               dur="4s"
               repeatCount="indefinite"/>
    </path>

    <path d="
      M70 75
      L220 235
      L390 120
      L550 255
      L720 125
      L880 245
      L1040 130
      L1160 250">

      <animate attributeName="stroke-opacity"
               values=".55;.08;.55"
               dur="6s"
               repeatCount="indefinite"/>
    </path>

  </g>

  <g filter="url(#glow)">

    <circle cx="170" cy="110"
            r="4"
            fill="#22d3ee">
      <animate attributeName="r"
               values="3;8;3"
               dur="2s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="320" cy="185"
            r="4"
            fill="#60a5fa">
      <animate attributeName="r"
               values="3;7;3"
               dur="2.6s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="450" cy="65"
            r="4"
            fill="#a78bfa">
      <animate attributeName="r"
               values="3;8;3"
               dur="2.3s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="600" cy="145"
            r="5"
            fill="#22d3ee">
      <animate attributeName="r"
               values="4;11;4"
               dur="2.5s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="760" cy="60"
            r="4"
            fill="#c084fc">
      <animate attributeName="r"
               values="3;8;3"
               dur="2.8s"
               repeatCount="indefinite"/>
    </circle>

    <circle cx="900" cy="165"
            r="4"
            fill="#f472b6">
      <animate attributeName="r"
               values="3;8;3"
               dur="2.4s"
               repeatCount="indefinite"/>
    </circle>

  </g>

  <g font-family="monospace"
     font-weight="bold"
     font-size="15">

    <text x="90"
          y="150"
          fill="#22d3ee"
          opacity=".4">
      &lt;/&gt;
      <animate attributeName="opacity"
               values=".1;.7;.1"
               dur="3s"
               repeatCount="indefinite"/>
    </text>

    <text x="1070"
          y="110"
          fill="#a78bfa"
          opacity=".4">
      { }
      <animate attributeName="opacity"
               values=".1;.7;.1"
               dur="4s"
               repeatCount="indefinite"/>
    </text>

    <text x="240"
          y="285"
          fill="#60a5fa"
          opacity=".35">
      API
      <animate attributeName="opacity"
               values=".1;.6;.1"
               dur="3.5s"
               repeatCount="indefinite"/>
    </text>

    <text x="930"
          y="285"
          fill="#f472b6"
          opacity=".35">
      SQL
      <animate attributeName="opacity"
               values=".1;.6;.1"
               dur="4.5s"
               repeatCount="indefinite"/>
    </text>

  </g>

  <circle cx="600"
          cy="150"
          r="135"
          fill="url(#cyanGlow)"
          opacity=".18">
    <animate attributeName="r"
             values="105;155;105"
             dur="6s"
             repeatCount="indefinite"/>
  </circle>

  <text x="600"
        y="142"
        text-anchor="middle"
        fill="url(#nameGradient)"
        font-family="Arial Black, Inter, Helvetica, sans-serif"
        font-size="62"
        font-weight="900"
        letter-spacing="7">
    HARSH OVHAL
  </text>

  <rect x="-5"
        y="0"
        width="2"
        height="340"
        fill="#22d3ee"
        filter="url(#glow)">

    <animate attributeName="x"
             values="-10;1210;-10"
             dur="9s"
             repeatCount="indefinite"/>

    <animate attributeName="opacity"
             values="0;.8;0"
             dur="9s"
             repeatCount="indefinite"/>

  </rect>

  <circle cy="35"
          r="2.5"
          fill="#22d3ee"
          filter="url(#glow)">

    <animate attributeName="cx"
             values="-20;1220;-20"
             dur="7s"
             repeatCount="indefinite"/>

    <animate attributeName="opacity"
             values="0;.9;0"
             dur="7s"
             repeatCount="indefinite"/>

  </circle>

  <circle cy="300"
          r="2"
          fill="#f472b6"
          filter="url(#glow)">

    <animate attributeName="cx"
             values="1220;-20;1220"
             dur="11s"
             repeatCount="indefinite"/>

    <animate attributeName="opacity"
             values="0;.8;0"
             dur="11s"
             repeatCount="indefinite"/>

  </circle>

</svg>
